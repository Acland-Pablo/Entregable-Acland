<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- JS -->
    <script defer src="../../js/carrito.js"></script>
    <title>Carrito</title>
    <style>
                        #goToProducts {
                            background: #3498db;
                            color: #fff;
                            border: none;
                            border-radius: 6px;
                            padding: 0.5rem 1.5rem;
                            font-size: 1rem;
                            cursor: pointer;
                            transition: background 0.2s;
                        }
                        #goToProducts:hover {
                            background: #217dbb;
                        }
                #cart-header {
                    display: flex;
                    justify-content: space-between;
                    width: 100%;
                    margin-top: 1.5rem;
                    margin-bottom: 0.5rem;
                }
                #cart-header div {
                    text-align: left;
                    font-weight: bold;
                    color: #3498db;
                }
                #cart-header div:last-child {
                    width: 100px;
                }
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            background: #fff;
            padding: 2rem 2.5rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin: 60px auto 0 auto;
            max-width: 900px;
            text-align: center;
        }
        h1, h2 {
            color: #3498db;
        }
        #cart-section {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            margin-top: 1.5rem;
            justify-items: start;
        }
        #cart-section .cart-card {
            background: #ecf0f1;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            padding: 1.2rem 1rem 1rem 1rem;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            transition: transform 0.15s;
        }
        #cart-section .cart-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        #cart-section .cart-card:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 4px 16px rgba(52,152,219,0.12);
        }
        #cart-section h3 {
            margin: 0 0 0.5rem 0;
            color: #3498db;
        }
        #cart-section h4 {
            margin: 0 0 1rem 0;
            color: #2d3436;
        }
        #cart-section .eliminar {
            background: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 0.5rem 1.2rem;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        #cart-section .eliminar:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CARRITO</h1>
        <div id="cart-header">
            <div>Producto</div>
            <div>Precio</div>
            <div></div>
        </div>
        <section id="cart-section"></section>
        <h2><button id="goToProducts">Volver a la Tienda</button></h2>
    </div>
</body>
</html>
