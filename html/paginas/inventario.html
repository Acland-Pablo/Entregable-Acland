<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario</title>
    <script defer src="../../js/inventario.js" ></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        header {
            background-color: #3498db;
            color: white;
            padding: 20px;
            text-align: center;
        }
        div {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        #admin {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
        }
        #logout {
            background: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 0.5rem 1.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        #admin p {
            margin: 0;
            text-align: left;
        }
        #admin #user {
            margin-left: 700px;
            text-align: right;
        }
        #gestion {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: flex-start;
            gap: 4rem;
        }
        #producto-container {
            background-color: #3498db;
            color: white;
            flex: 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        #producto-container button {
            background: #217dbb;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 0.5rem 1.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        #producto-container button:hover {
            background: #145a8a;
        }
        #content-logout {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            width: 100%;
            gap: 5rem;
        }
        #logout {
            background: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 0.5rem 1.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 1rem;
        }
        #logout:hover {
            background: #c0392b;
        }
        #mensaje {
            flex: 1;
            width: 100%;
            text-align: right;
        }
        footer {
            background-color: #3498db;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Inventario</h1>
    </header>
    
    <div>
        <div id="admin">
            <p>Ingrese el nombre y precio del producto</p>
            <div id="user"></div>
        </div>
        
    <div id="gestion">
        <div id="producto-container">
            <p>Nombre:</p>
            <input type="text" id="nombre">
            <p>Precio:</p>
            <input type="text" id="precio">
            <button id="agregar">Agregar</button>
        </div>
        <div id="content-logout">
        <div id="mensaje"></div>
        <button id="logout">Logout</button>
        </div>
    </div>
    </div>
    <footer>
        <p>&copy; 2024 Acland. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
